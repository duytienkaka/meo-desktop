<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self'; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'"><title>Mèo Desktop — Bảng Game</title><link rel="stylesheet" href="game-panel.css"></head><body><main id="card"><header><span>ĐỒNG ĐỘI NHỎ</span><button id="close" aria-label="Đóng bảng Game">×</button></header><h1 id="game-name">Phiên chơi của bạn</h1><div class="clock-row"><strong id="elapsed">00:00</strong><button id="clock-toggle">Tạm dừng giờ</button></div><p id="session-status" class="muted" role="status"></p><section id="rest-card"><div><strong id="rest-title">Lần nghỉ tiếp theo</strong><span id="rest-time"></span></div><div class="buttons"><button id="take-break">Nghỉ 5 phút</button><button id="resume" hidden>Quay lại</button><button id="snooze" hidden>Để sau 10 phút</button></div><small>Đây là bộ đếm giờ, không tạm dừng game.</small></section><section class="music"><div><strong id="track">Chưa có nhạc</strong><small id="artist"></small></div><div class="transport"><button id="previous" aria-label="Bài trước">⏮</button><button id="play" aria-label="Phát hoặc dừng nhạc">▶</button><button id="next" aria-label="Bài tiếp theo">⏭</button></div></section><div class="volume"><button id="mute">Tắt tiếng</button><input id="volume" type="range" min="0" max="100" step="1" aria-label="Âm lượng hệ thống"><output id="level">0%</output></div><div class="bottom-actions"><button id="corner-left">Góc trái</button><button id="corner-right">Góc phải</button><button id="visibility">Ẩn mèo</button></div><footer><span id="shortcut"></span><button id="reset">Phiên mới</button></footer><p id="error" role="alert" hidden></p></main><script src="game-panel.js"></script></body></html>
